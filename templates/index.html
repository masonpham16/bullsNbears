<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Live Stock Display</title>
		<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
	</head>
	<body>

		<!-- Floating Market Status Banner -->
		<div id="marketBanner" class="market-banner hidden">
			<div class="market-banner__box">
				<span class="market-banner__title">Market Closed</span>
				<span class="market-banner__sub">(Regular hours: 9:30 AM–4:00 PM ET)</span>
			</div>
		</div>

		<main class="card">
			<h1>Live Stock Display</h1>

			<div class="sub">
				Symbols: {{ symbols | join(", ") }} • Poll: {{ poll_seconds }}s
			</div>

			<div class="grid-wrap" id="gridWrap">
				<canvas id="dots" class="dots-canvas"></canvas>

				<div class="grid" id="stockGrid">
					{% for symbol in symbols %}
					<div class="stock-card" id="card-{{ symbol }}">
						<h3>{{ symbol }}</h3>

						<div class="dot-region" id="region-{{ symbol }}"></div>

						<div class="stat">
							<div class="label">Current Price</div>
							<div class="value" id="price-{{ symbol }}">—</div>
						</div>

						<div class="stat">
							<div class="label">Day Change</div>
							<div class="value" id="change-{{ symbol }}">—</div>
						</div>

						<div class="stat">
							<div class="label">Volume</div>
							<div class="value" id="volume-{{ symbol }}">—</div>
						</div>

						<div class="footer">
							Last update: <span id="ts-{{ symbol }}">—</span>
						</div>
					</div>
					{% endfor %}
				</div>
			</div>
		</main>

		<!-- Socket.IO -->
		<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
		<script defer src="{{ url_for('static', filename='app.js') }}"></script>

	</body>
</html>
